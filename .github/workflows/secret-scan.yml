name: secret-scan

# 全历史密钥扫描：GitHub Secret Scanning 的补充，覆盖 DeepSeek / 豆包这类
# 非标准 provider 格式。任何一次 push / PR 都会跑；每周再三跑一次兜底。
on:
  push:
  pull_request:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks（默认规则 + 项目自定义规则）
    runs-on: ubuntu-latest
    steps:
      - name: Checkout（拉全历史）
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装 gitleaks 8.30.1
        run: |
          set -euo pipefail
          curl -sSL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: 扫描全部 git 历史
        run: gitleaks detect --source . --config .gitleaks.toml --redact --no-banner --verbose --exit-code 1

  project-rules:
    name: 项目自定义规则（DeepSeek / 豆包形状）
    runs-on: ubuntu-latest
    steps:
      - name: Checkout（拉全历史）
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 运行 scripts/secret_scan.py --all
        run: python3 scripts/secret_scan.py --all
