# ============================================================================
#  iRacing 语音问答助手 · 配置文件
# ----------------------------------------------------------------------------
#  方案：PTT 提问 → 本地识别 → 意图路由 → 直接播放语音包里对应 msgId 的音频
#  （早期那份 answers_library.yaml 片段拼装体系已废弃，不要参考）
# ============================================================================

version: 2

# ---------------------------------------------------------------------------
#  语音包 —— 回答素材的唯一来源
# ---------------------------------------------------------------------------
voice_pack:
  # 主包（发行版为 16 kHz / 16-bit；24 kHz 母带见 DEVELOPMENT.md）。
  # 开发时指向 build/pack（v2.0.0 工作副本）；游戏里装好 v2.0.0 之后
  # 改成 "D:/iRacing/sound/spcc/Mandarin-CNTW-Xusheng_Chen" 即可。
  dir: "../build/pack/Mandarin-CNTW-Xusheng_Chen"
  # 助手专用补充素材（「还剩」「圈」这类拼装连接件，用同一音色合成）
  extra_dir: "../build/assistant-extra"
  telemetry_dir: "../build/assistant-telemetry"
  # 同一 msgId 有多条变体时，冷却期内的变体不再抽中
  # 冷却长度 = min(变体数 - 2, cooldown)
  cooldown: 4
  # 冷却状态落盘位置 —— 跨场次保持连续，重启不会重置
  state_file: "./state/cooldown.json"

# ---------------------------------------------------------------------------
#  遥测
# ---------------------------------------------------------------------------
telemetry:
  provider: irsdk          # irsdk | sim（sim 用内置假数据，方便无游戏时调逻辑）
  poll_hz: 60
  # 正赛发车前 CPU 本来就满载，采集线程别抢资源
  thread_priority: below_normal
  ring_buffer:
    keep_laps: 20          # 保留最近多少圈的样本，用于算派生量
  # 走势窗口：用最近多少秒的数据判断「追近 / 拉开」
  trend_window_s: 6.0

# ---------------------------------------------------------------------------
#  语音输入（里程碑 3）
# ---------------------------------------------------------------------------
asr:
  # 本地识别模型，候选见 tools/asr_models.py。
  # 2026-10-12 对比测试（378 条测试音频 × 3 档噪声）：
  #   sense-voice    正例命中 ~99%，松键出字 25ms，RTF 0.016，载入 0.6s  ← 采用
  #   zipformer-ctc  正例命中 ~99%，松键出字 34ms，RTF 0.021，载入 1.9s
  #   streaming-zip  正例命中 ~82%，有 11% 空转写，淘汰
  model: sense-voice
  models_dir: "../models"
  num_threads: 4

ptt:
  # 对讲键：右 Ctrl。也可以写 "RCONTROL" / "MOUSE5"（鼠标侧键）等，见 src/listener.py
  vk: 0xA3
  poll_ms: 10
  min_hold_ms: 250          # 短于这个时长当误触
  max_hold_s: 8.0
  input_device: null        # null = 系统默认麦克风；用 --list-devices 查序号

# ---------------------------------------------------------------------------
#  意图层
# ---------------------------------------------------------------------------
intent:
  l1_keyword:
    # 短语库（受限模糊匹配）是主路径；L1 关键词只兜底。
    # 想彻底「绝不猜」就关掉它：关掉后对不上短语库一律拒绝。
    enabled: true
    note: "键盘输入：短语库命中优先，L1 兜底。语音输入见下面的 voice_strict"
  # 语音输入严格模式：只认短语库，L1 完全不参与（绝不猜）。
  # 实测 14 条越界句里 L1 兜底会漏收 1 条，开车场景不值得冒这个险。
  voice_strict: true
  l2_embedding:
    enabled: false         # 先不做：依赖太重（需要 torch），且与正赛抢 CPU
    model: "paraphrase-multilingual-MiniLM-L12-v2"
    threshold: 0.55
  l3_llm:
    enabled: false         # 先纯本地跑，靠未命中日志决定要不要接
    provider: volc_ark
    base_url: "https://ark.cn-beijing.volces.com/api/v3"
    api_key: ""
    model: "doubao-seed-1-6-flash-250828"
    temperature: 0
    max_tokens: 24
    timeout_s: 1.5
  miss_log:
    enabled: true
    path: "./logs/intent_miss.jsonl"

# ---------------------------------------------------------------------------
#  播放
# ---------------------------------------------------------------------------
playback:
  enabled: true            # false = 只打印不发声，方便无音频设备时调逻辑
  device: null             # null = 系统默认输出；也可填设备序号/名称（--list-devices 查）
  volume: 1.0
  # 播报时把游戏音量压低 —— 用 Windows 按应用音量（pycaw），
  # 只动 iRacing 自己的会话，不碰系统总音量。iRacing 没在跑时自动跳过。
  ducking:
    enabled: true
    processes: ["iRacingSim64DX11.exe"]
    amount_db: -12.0

# ---------------------------------------------------------------------------
#  防音频回环 —— 最危险的坑：播出的声音被麦克风收回去会形成「自己问自己答」
# ---------------------------------------------------------------------------
audio_guard:
  ptt_only: true                 # 只在按住 PTT 期间收音
  mute_mic_while_playing: true   # 播报期间静麦

# ---------------------------------------------------------------------------
#  日志
# ---------------------------------------------------------------------------
logging:
  level: info
  dir: "./logs"
  # 每次问答都记录：问法 / 命中意图 / 命中路径 / msgId / 变体 / 延迟
  qa_log: "./logs/qa.jsonl"

# ---------------------------------------------------------------------------
#  AI 比赛工程师（可选，默认关闭）
# ---------------------------------------------------------------------------
#  规则层仍然是主力：它能答的问题永远走录音，毫秒级、零成本、离线可用。
#  这里配的是「规则答不上时」的补充能力，需要用户自己接一个大模型。
#
#  接入方式：填 base_url / model，按 OpenAI Chat Completions 协议调用。
#  常见服务：
#      DeepSeek    https://api.deepseek.com          deepseek-chat
#      火山方舟     https://ark.cn-beijing.volces.com/api/v3   填你的接入点 ID
#      月之暗面     https://api.moonshot.cn/v1        moonshot-v1-8k
#      本地 Ollama  http://127.0.0.1:11434/v1         qwen2.5:7b
#
#  api_key 不要写在这里——这个文件会随安装包分发。
#  密钥写到同目录的 config.local.yaml，或设环境变量
#  LITTLE_NAVIGATOR_AI_KEY（优先级最高）。
#
#  下面的数值是**硬上限**，可以调小，调大无效（代码会钳制并留日志）：
#      timeout_s <= 2.0   max_tokens <= 300   max_answer_chars <= 60
ai:
  enabled: false
  # 档位：whitelist 只对白名单意图与所有分析型问题接管（默认、最省）
  #       analysis_key 按住专用键提问时才走 AI
  #       full 规则答不上就交给模型（最智能、最慢、最贵）
  mode: "whitelist"
  provider: "custom"          # 仅用于界面预填
  base_url: ""
  model: ""
  timeout_s: 2.0
  max_tokens: 300
  max_answer_chars: 60
  rate_limit_per_min: 6
  # 分析键：默认不绑。首次启用 AI 时界面会引导采集一次，
  # 避免与游戏内按键冲突。vk 是 Windows 虚拟键码。
  analysis_key: null
  whitelist_intents:
    - query_laptime
    - query_pit
    - query_fuel
    - query_gap
    - query_opponent
    - query_weather
    - query_damage
  # 语音合成（可选，默认关）。不配就只有文字，不影响使用。
  #   adapter: off | doubao | openai
  #   豆包额外需要 speaker（音色 ID），resource_id 默认 seed-tts-2.0
  #   OpenAI 兼容需要 base_url + voice
  tts:
    adapter: "off"
    base_url: ""
    model: ""
    voice: ""
    speaker: ""
    resource_id: "seed-tts-2.0"
    format: "wav"
    sample_rate: 16000
    timeout_s: 1.5
